<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>清掃費の請求</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a paper slip; staff form on top, monthly ledger below. Owner gets a ledger tab. */
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1d2523; --muted:#66706c; --line:#d9ddd8;
  --accent:#1f5f5b; --accent-ink:#ffffff; --accent-soft:#e2eeec;
  --good:#2d7a46; --good-soft:#e3f1e6; --warn:#a2641a; --warn-soft:#f7ecdc; --bad:#b23a32;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --paper:#1c2321; --ink:#e7ece9; --muted:#9aa5a0; --line:#2f3936;
  --accent:#6cb8b1; --accent-ink:#0f1a18; --accent-soft:#1f3431;
  --good:#7cc893; --good-soft:#1d3324; --warn:#e2ad62; --warn-soft:#382a17; --bad:#ef8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --paper:#1c2321; --ink:#e7ece9; --muted:#9aa5a0; --line:#2f3936;
  --accent:#6cb8b1; --accent-ink:#0f1a18; --accent-soft:#1f3431;
  --good:#7cc893; --good-soft:#1d3324; --warn:#e2ad62; --warn-soft:#382a17; --bad:#ef8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header h1{font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.card h2{font-size:16px;margin:0 0 12px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:440px){.grid{grid-template-columns:1fr}}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:42px;display:block;text-align:left}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.yen{position:relative}.yen input{padding-left:26px;font-family:var(--f-num);text-align:right}
.yen::before{content:"¥";position:absolute;left:10px;top:9px;color:var(--muted);font-family:var(--f-num)}
textarea{min-height:60px;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.small{padding:4px 10px;font-size:13px}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.total-line{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.total-line .num{font-size:22px;font-weight:600}
.msg{font-size:13px;min-height:1.2em}.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:4px;align-self:flex-start}
.tabs button{border:none;background:none;padding:6px 14px}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.items li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.items li:last-child{border-bottom:none}
.items .d{font-family:var(--f-num);font-size:13px;color:var(--muted);padding-top:2px}
.items .body{min-width:0}
.items .prop{font-weight:500}
.items .bd{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.items .amt{text-align:right}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;letter-spacing:.04em}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.unpaid{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
pre.slip{white-space:pre-wrap;font-family:var(--f-num);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:12px;margin:10px 0 0;overflow-x:auto}
.staff-block{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.staff-block:first-of-type{border-top:none;margin-top:0;padding-top:0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.sum div{background:var(--bg);border-radius:7px;padding:8px 10px}
.sum .k{font-size:11px;color:var(--muted)}
.sum .v{font-family:var(--f-num);font-size:17px;font-weight:600}
@media (max-width:440px){.sum{grid-template-columns:1fr 1fr}}
.note{font-size:12px;color:var(--muted)}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:8px 12px;font-size:14px;font-weight:500}
#loginPin{font-family:var(--f-num);letter-spacing:.4em;font-size:20px}
#loginPin::placeholder{letter-spacing:0;font-family:var(--f-body);font-size:15px}
.bill-box{margin-top:14px;background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.pill.billed{background:var(--accent-soft);color:var(--accent)}
.bank{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.inv-preview{margin-top:10px}
.inv-preview img{display:block;width:100%;border:1px solid var(--line);border-radius:6px}
.inv-preview p{font-size:12px;color:var(--muted);margin:6px 0 0}
/* Invoice sheet: rendered off-screen at A4 width, always on white paper so the file looks the same in any theme */
#invStage{position:absolute;left:-10000px;top:0;width:794px;pointer-events:none}
.inv{width:794px;min-height:1123px;background:#fff;color:#1a1a1a;font-family:var(--f-body);padding:64px 60px;box-sizing:border-box;font-size:13px;line-height:1.6}
.inv h1{font-size:28px;letter-spacing:.6em;text-align:center;margin:0 0 30px;font-weight:700;padding-left:.6em}
.inv .meta{display:flex;justify-content:flex-end;gap:24px;font-size:12px;margin-bottom:22px}
.inv .meta span b{font-weight:500;color:#555;margin-right:6px}
.inv .parties{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.inv .to{font-size:19px;border-bottom:1px solid #1a1a1a;padding-bottom:4px;min-width:300px}
.inv .from{text-align:right;font-size:13px}
.inv .from .nm{font-size:16px;font-weight:700}
.inv .lead{margin:26px 0 10px}
.inv .amount{display:flex;align-items:baseline;gap:18px;border:2px solid #1f5f5b;padding:12px 18px;width:fit-content}
.inv .amount .k{font-size:14px}
.inv .amount .v{font-family:var(--f-num);font-size:26px;font-weight:600}
.inv table{width:100%;border-collapse:collapse;margin-top:26px;font-size:12px}
.inv th{background:#e9f0ef;color:#1a1a1a;font-weight:700;padding:7px 8px;border:1px solid #c9d3d1;text-align:center}
.inv td{padding:7px 8px;border:1px solid #d6dcdb;vertical-align:top}
.inv td.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
.inv td.c{text-align:center;white-space:nowrap}
.inv td small{display:block;color:#666;font-size:10.5px}
.inv tfoot td{font-weight:700;background:#f6f8f8}
.inv .bankbox{margin-top:26px;border:1px solid #c9d3d1;padding:12px 16px}
.inv .bankbox .k{font-weight:700;margin-bottom:4px}
.inv .foot{margin-top:18px;font-size:11px;color:#666}
</style>
<style>
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
.lines{display:flex;flex-direction:column;gap:12px}
.line{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--bg)}
.line .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.line .lh b{font-size:13px;color:var(--muted);font-weight:500}
.line input,.line select{background:var(--paper)}
.done{text-align:center;padding-block:28px}
.done .big{font-size:20px;font-weight:700;margin:0 0 6px}
.done .num{font-size:18px}
.inv-list{display:flex;flex-direction:column}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>清掃費の請求</h1>
    <p id="lead">お名前・振込先・勤務日を入力して送信してください。入力した内容はこの画面にも他の人にも表示されません。</p>
  </header>

  <div id="loading" class="card" hidden><p class="empty">読み込み中…</p></div>
  <div id="nodb" class="card" hidden>
    <h2 id="nodbTitle"></h2>
    <p class="note" id="nodbText"></p>
  </div>

  <!-- STAFF VIEW -->
  <form id="staff" hidden style="display:flex;flex-direction:column;gap:18px" autocomplete="off">
    <div class="card">
      <h2>請求者・振込先</h2>
      <div class="grid">
        <div class="full"><label class="lbl" for="nameInput">お名前（請求書に載ります）</label>
          <input id="nameInput" maxlength="40" placeholder="例：山田 花子" required></div>
        <div><label class="lbl" for="bBank">銀行名</label><input id="bBank" maxlength="40" placeholder="例：横浜銀行" required></div>
        <div><label class="lbl" for="bBranch">支店名</label><input id="bBranch" maxlength="40" placeholder="例：伊勢佐木町支店" required></div>
        <div><label class="lbl" for="bType">口座種別</label>
          <select id="bType"><option value="普通">普通</option><option value="当座">当座</option></select></div>
        <div><label class="lbl" for="bNumber">口座番号</label><input id="bNumber" inputmode="numeric" maxlength="8" placeholder="7桁" required></div>
        <div class="full"><label class="lbl" for="bHolder">口座名義（カタカナ）</label><input id="bHolder" maxlength="40" placeholder="例：ヤマダ ハナコ" required></div>
      </div>
    </div>

    <div class="card">
      <h2>請求内容</h2>
      <div class="grid">
        <div><label class="lbl" for="month">何月分</label><input id="month" type="month" required></div>
        <div><label class="lbl" for="billDate">請求日</label><input id="billDate" type="date" required></div>
      </div>
    </div>

    <div class="card">
      <h2>勤務日</h2>
      <div class="lines" id="lines"></div>
      <button type="button" id="addLine" style="margin-top:12px;width:100%">＋ 勤務日を追加</button>
      <div class="total-line spread">
        <span class="lbl" style="margin:0">合計（<span id="dayCount">0</span>日）</span>
        <span class="num" id="total">¥0</span>
      </div>
      <div style="margin-top:14px"><label class="lbl" for="note">備考（任意）</label>
        <textarea id="note" maxlength="300" placeholder="気になった点、備品の補充など"></textarea></div>
    </div>

    <div class="card">
      <button class="primary" type="submit" id="sendBtn" style="width:100%;padding:12px">この内容で請求する</button>
      <p class="msg" id="sendMsg" style="text-align:center"></p>
      <div class="row" style="justify-content:center">
        <button type="button" class="small" id="pdfBtn">請求書をPDFで保存</button>
        <button type="button" class="small" id="pngBtn">画像で保存</button>
      </div>
      <p class="msg" id="slipMsg" style="text-align:center"></p>
      <div id="myPreview" class="inv-preview" hidden></div>
      <p class="note" style="margin:8px 0 0">「請求する」を押すとオーナーに届きます。LINEで請求書を送る必要はありません。PDFは自分の控えが欲しいときだけ保存してください。</p>
    </div>
  </form>

  <div id="done" class="card done" hidden>
    <p class="big">請求を送信しました</p>
    <p class="note">受付番号</p>
    <p class="num" id="doneId"></p>
    <p class="note" style="margin-top:12px">ありがとうございました。この画面は閉じて大丈夫です。</p>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button type="button" class="small" id="donePdf">控えをPDFで保存</button>
      <button type="button" class="small" id="newBtn">別の請求を入力する</button>
    </div>
    <p class="msg" id="doneMsg"></p>
  </div>

  <!-- ADMIN VIEW -->
  <section id="admin" hidden style="display:flex;flex-direction:column;gap:18px">
    <div class="card">
      <div class="spread">
        <h2 style="margin:0">届いた請求</h2>
        <button class="link" id="adReload" type="button">最新にする</button>
        <input id="adMonth" type="month" style="width:auto">
      </div>
      <div class="sum" style="margin-top:12px">
        <div><div class="k">請求合計</div><div class="v" id="adTotal">¥0</div></div>
        <div><div class="k">未払い</div><div class="v" id="adUnpaid">¥0</div></div>
        <div><div class="k">勤務日数</div><div class="v" id="adCount">0</div></div>
      </div>
      <div id="adList" class="inv-list" style="margin-top:14px"></div>
      <div class="row" style="margin-top:14px">
        <button id="copyCsv" type="button">この月をCSVでコピー</button>
        <span class="msg" id="csvMsg"></span>
      </div>
    </div>
    <form id="cfgForm" class="card">
      <h2>請求書の宛名</h2>
      <div class="row">
        <input id="cfgPayee" maxlength="60" placeholder="例：〇〇合同会社 御中" style="flex:1;min-width:200px">
        <button class="primary" type="submit">保存</button>
      </div>
      <p class="msg" id="cfgMsg"></p>
    </form>
  </section>
</div>

<div id="invStage" aria-hidden="true"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ===== 設定：Apps Script を公開したときのURL ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbyaIBo_SMLdxN7P3ek6SxUmam26Qz6TTktrea5W4Bfe_XUihKqVFisFPbBgX4thhavUJg/exec";
/* ================================================== */

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const ADMIN = qs.get("admin") || "";
const PROPERTIES = ["Grand House（睦町）", "Good Tiny House（中村町）", "その他"];
const yen = n => "¥" + (Number(n)||0).toLocaleString("ja-JP");
const int = v => { const n = Math.round(Number(v)); return Number.isFinite(n) && n > 0 ? n : 0; };
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const thisMonth = () => today().slice(0,7);
const sumOf = it => int(it.cleaning)+int(it.parking)+int(it.otherAmt);
const jpMonth = m => { const [y,mo] = m.split("-"); return `${y}年${Number(mo)}月`; };
const fmtDate = d => { const [,m,dd] = d.split("-"); return `${Number(m)}/${Number(dd)}`; };
const slashDate = d => d ? d.replace(/-/g,"/") : "";
const bankLine = b => b && b.bank ? `${b.bank} ${b.branch} ${b.type} ${b.number} ${b.holder}` : "";
function flash(el, text, kind){ el.textContent = text; el.className = "msg " + (kind||""); if(kind==="ok") setTimeout(()=>{ if(el.textContent===text) el.textContent=""; }, 2500); }
async function copyText(text, msgEl){
  try { await navigator.clipboard.writeText(text); flash(msgEl, "コピーしました", "ok"); }
  catch { flash(msgEl, "コピーできませんでした", "err"); }
}
function itemLine(it){
  const parts = [];
  if (int(it.cleaning)) parts.push("清掃 " + yen(it.cleaning));
  if (int(it.parking)) parts.push("駐車場 " + yen(it.parking));
  if (int(it.otherAmt)) parts.push((it.otherNote||"その他") + " " + yen(it.otherAmt));
  return parts.join(" / ");
}

async function api(action, payload = {}){
  let res;
  try {
    res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, admin: ADMIN, ...payload }) });
  } catch { throw new Error("通信できませんでした。電波の良いところでもう一度お試しください"); }
  let j; try { j = await res.json(); } catch { throw new Error("サーバーから正しい返事がありませんでした"); }
  if (!j.ok) throw new Error(j.error || "エラーが発生しました");
  return j;
}

let payee = "";

/* ---------- 請求書（PDF / 画像） ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// inv = {id?, name, bank, month, date, lines, note?}
function invoiceHTML(inv){
  const list = inv.lines;
  const total = list.reduce((s,it)=>s+sumOf(it),0);
  const c = list.reduce((s,it)=>s+int(it.cleaning),0), p = list.reduce((s,it)=>s+int(it.parking),0), o = list.reduce((s,it)=>s+int(it.otherAmt),0);
  const b = inv.bank || {};
  const rows = list.map(it => `<tr>
    <td class="c">${esc(fmtDate(it.date))}</td>
    <td>${esc(it.property)}</td>
    <td class="n">${int(it.cleaning) ? yen(it.cleaning) : ""}</td>
    <td class="n">${int(it.parking) ? yen(it.parking) : ""}</td>
    <td class="n">${int(it.otherAmt) ? yen(it.otherAmt) : ""}${it.otherNote ? `<small>${esc(it.otherNote)}</small>` : ""}</td>
    <td class="n">${yen(sumOf(it))}</td></tr>`).join("");
  return `<div class="inv">
    <h1>請求書</h1>
    <div class="meta">${inv.id ? `<span><b>受付番号</b>${esc(inv.id)}</span>` : ""}<span><b>請求日</b>${esc(slashDate(inv.date || today()))}</span></div>
    <div class="parties">
      <div class="to">${esc(payee || "　　　　　　　　 御中")}</div>
      <div class="from"><div class="nm">${esc(inv.name || "")}</div></div>
    </div>
    <p class="lead">${esc(jpMonth(inv.month))}分の清掃業務について、下記のとおりご請求申し上げます。</p>
    <div class="amount"><span class="k">ご請求金額</span><span class="v">${yen(total)}</span></div>
    <table>
      <thead><tr><th style="width:12%">勤務日</th><th>物件</th><th style="width:14%">清掃費</th><th style="width:13%">駐車場代</th><th style="width:17%">その他</th><th style="width:14%">小計</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="c" colspan="2">合計（${list.length}日）</td><td class="n">${yen(c)}</td><td class="n">${yen(p)}</td><td class="n">${yen(o)}</td><td class="n">${yen(total)}</td></tr></tfoot>
    </table>
    <div class="bankbox"><div class="k">お振込先</div>${b.bank ? esc(`${b.bank}　${b.branch}　${b.type}　${b.number}`) + "<br>口座名義：" + esc(b.holder) : "（未記入）"}</div>
    ${inv.note ? `<p class="foot">備考：${esc(inv.note)}</p>` : ""}
  </div>`;
}
async function renderInvoiceCanvas(inv){
  if (!window.html2canvas || !window.jspdf) throw new Error("lib");
  const stage = $("invStage"); stage.innerHTML = invoiceHTML(inv);
  try { await document.fonts.ready; } catch {}
  const canvas = await html2canvas(stage.firstElementChild, { scale: 2, backgroundColor: "#ffffff", logging: false });
  stage.replaceChildren();
  return canvas;
}
function canvasToPdfBlob(canvas){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
  const pageW = 210, pageH = 297, pxPerPage = Math.floor(canvas.width * pageH / pageW);
  for (let y = 0, i = 0; y < canvas.height; y += pxPerPage, i++){
    const h = Math.min(pxPerPage, canvas.height - y);
    const part = document.createElement("canvas"); part.width = canvas.width; part.height = h;
    const ctx = part.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,part.width,h); ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
    if (i) pdf.addPage();
    pdf.addImage(part.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, pageW, h * pageW / canvas.width);
  }
  return pdf.output("blob");
}
function saveBlob(blob, filename){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
async function exportInvoice(kind, inv, msgEl, previewEl){
  if (!inv.lines.length) return flash(msgEl, "勤務日がありません", "err");
  flash(msgEl, "作成中…", "");
  let canvas;
  try { canvas = await renderInvoiceCanvas(inv); }
  catch { return flash(msgEl, "請求書を作れませんでした。ページを開き直してもう一度お試しください", "err"); }
  const base = `請求書_${(inv.name||"").replace(/\s+/g,"")}_${jpMonth(inv.month)}`;
  try {
    const blob = kind === "pdf" ? canvasToPdfBlob(canvas) : await new Promise(r => canvas.toBlob(r, "image/png"));
    saveBlob(blob, base + (kind === "pdf" ? ".pdf" : ".png"));
    flash(msgEl, kind === "pdf" ? "PDFを保存しました" : "画像を保存しました", "ok");
  } catch { flash(msgEl, "保存できませんでした", "err"); }
  if (kind === "png" && previewEl){
    previewEl.replaceChildren();
    const img = document.createElement("img"); img.src = canvas.toDataURL("image/png"); img.alt = "請求書";
    const p = document.createElement("p"); p.textContent = "保存されない場合は、画像を長押しして保存してください。";
    previewEl.append(img, p); previewEl.hidden = false;
  }
}

/* ---------- スタッフ画面（入力→送信だけ。何も保存・表示しない） ---------- */
let lineSeq = 0;
function addLine(data = {}){
  const n = ++lineSeq, box = $("lines");
  const el = document.createElement("div"); el.className = "line"; el.dataset.n = n;
  const opts = PROPERTIES.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
  el.innerHTML = `
    <div class="lh"><b class="lt"></b><button type="button" class="link rm">この日を削除</button></div>
    <div class="grid">
      <div><label class="lbl" for="d${n}">勤務日</label><input id="d${n}" type="date" class="f-date"></div>
      <div><label class="lbl" for="p${n}">物件</label><select id="p${n}" class="f-prop">${opts}</select></div>
      <div><label class="lbl" for="c${n}">清掃費</label><div class="yen"><input id="c${n}" class="f-clean" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div></div>
      <div><label class="lbl" for="k${n}">駐車場代</label><div class="yen"><input id="k${n}" class="f-park" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div></div>
      <div><label class="lbl" for="o${n}">その他の金額</label><div class="yen"><input id="o${n}" class="f-other" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div></div>
      <div><label class="lbl" for="t${n}">その他の内容</label><input id="t${n}" class="f-onote" maxlength="60" placeholder="例：洗剤購入"></div>
    </div>`;
  const q = s => el.querySelector(s);
  q(".f-date").value = data.date || today();
  if (data.property) q(".f-prop").value = data.property;
  el.querySelector(".rm").onclick = () => { el.remove(); if (!box.children.length) addLine(); renumber(); updateTotal(); };
  el.addEventListener("input", updateTotal);
  box.append(el); renumber(); updateTotal();
  return el;
}
function renumber(){
  const rows = [...$("lines").children];
  rows.forEach((el, i) => { el.querySelector(".lt").textContent = `${i+1}日目`; el.querySelector(".rm").hidden = rows.length === 1; });
}
function readLines(){
  return [...$("lines").children].map(el => {
    const q = s => el.querySelector(s);
    return { date: q(".f-date").value, property: q(".f-prop").value, cleaning: int(q(".f-clean").value),
             parking: int(q(".f-park").value), otherAmt: int(q(".f-other").value), otherNote: q(".f-onote").value.trim() };
  });
}
function updateTotal(){
  const ls = readLines();
  $("total").textContent = yen(ls.reduce((s,l)=>s+sumOf(l),0));
  $("dayCount").textContent = ls.length;
}
function readForm(){
  return {
    name: $("nameInput").value.trim(),
    bank: { bank: $("bBank").value.trim(), branch: $("bBranch").value.trim(), type: $("bType").value,
            number: $("bNumber").value.replace(/\D/g,""), holder: $("bHolder").value.trim() },
    month: $("month").value, date: $("billDate").value, note: $("note").value.trim(),
    lines: readLines().sort((a,b) => a.date < b.date ? -1 : 1),
  };
}
function validate(inv){
  if (!inv.name) return "お名前を入れてください";
  if (!inv.bank.bank || !inv.bank.branch || !inv.bank.holder) return "振込先をすべて入れてください";
  if (!/^\d{7,8}$/.test(inv.bank.number)) return "口座番号は7桁の数字で入れてください";
  if (!inv.month) return "何月分かを選んでください";
  if (!inv.date) return "請求日を入れてください";
  const ls = readLines();
  for (let i = 0; i < ls.length; i++){
    if (!ls[i].date) return `${i+1}日目の勤務日を入れてください`;
    if (!sumOf(ls[i])) return `${i+1}日目の金額を入れてください`;
    if (ls[i].otherAmt && !ls[i].otherNote) return `${i+1}日目の「その他の内容」を書いてください`;
  }
  return "";
}
let lastSent = null;
function startStaff(){
  $("staff").hidden = false;
  $("month").value = thisMonth(); $("billDate").value = today();
  addLine();
  $("addLine").onclick = () => { const el = addLine(); el.querySelector(".f-date").focus(); };
  $("staff").addEventListener("input", () => { if ($("sendMsg").classList.contains("err")) $("sendMsg").textContent = ""; });
  $("staff").addEventListener("submit", async e => {
    e.preventDefault();
    const inv = readForm(), err = validate(inv);
    if (err) return flash($("sendMsg"), err, "err");
    $("sendBtn").disabled = true; flash($("sendMsg"), "送信中…", "");
    try {
      const j = await api("submit", { invoice: inv });
      lastSent = { ...inv, id: j.id };
      $("doneId").textContent = j.id;
      $("staff").hidden = true; $("done").hidden = false; $("lead").hidden = true;
      window.scrollTo(0, 0);
    } catch (er) { flash($("sendMsg"), er.message, "err"); $("sendBtn").disabled = false; }
  });
  const exp = kind => { const inv = readForm(), err = validate(inv); if (err) return flash($("slipMsg"), err, "err"); exportInvoice(kind, inv, $("slipMsg"), $("myPreview")); };
  $("pdfBtn").onclick = () => exp("pdf");
  $("pngBtn").onclick = () => exp("png");
  $("donePdf").onclick = () => exportInvoice("pdf", lastSent, $("doneMsg"));
  // 送信後は入力内容を消してから新しく入力（同じ端末を別の人が使っても見えないように）
  $("newBtn").onclick = () => location.replace(location.pathname);
  api("payee").then(j => { payee = j.payee || ""; }).catch(() => {});
}

/* ---------- 管理画面 ---------- */
let invoices = [];
function renderAdmin(){
  const month = $("adMonth").value || thisMonth();
  const list = invoices.filter(v => v.month === month).sort((a,b) => (a.name||"").localeCompare(b.name||"","ja") || (a.date < b.date ? -1 : 1));
  const box = $("adList"); box.replaceChildren();
  let total = 0, unpaid = 0, days = 0;
  for (const v of list){
    total += v.total; if (!v.paid) unpaid += v.total; days += v.lines.length;
    const blk = document.createElement("div"); blk.className = "staff-block";
    const head = document.createElement("div"); head.className = "spread";
    const left = document.createElement("div"); left.style.minWidth = "0";
    const nm = document.createElement("div"); nm.className="prop"; nm.textContent = v.name;
    const bk = document.createElement("div"); bk.className="bank"; bk.textContent = `振込先：${bankLine(v.bank)}`;
    const meta = document.createElement("div"); meta.className="bank"; meta.textContent = `請求日 ${slashDate(v.date)}　受付 ${v.receivedAt}　No.${v.id}`;
    left.append(nm, bk, meta);
    const right = document.createElement("div"); right.className="row";
    const tt = document.createElement("span"); tt.className="num"; tt.style.fontWeight="600"; tt.textContent = yen(v.total);
    const tg = document.createElement("button"); tg.type="button"; tg.className = "pill " + (v.paid?"paid":"unpaid"); tg.style.border="none"; tg.style.cursor="pointer";
    tg.textContent = v.paid ? "支払済 ✓" : "未払い"; tg.title = "タップで切り替え";
    tg.onclick = () => setPaid([v.id], !v.paid, tg);
    right.append(tt, tg);
    head.append(left, right);
    const ul = document.createElement("ul"); ul.className = "items";
    for (const it of v.lines){
      const li = document.createElement("li");
      const d = document.createElement("span"); d.className="d"; d.textContent = fmtDate(it.date);
      const b = document.createElement("div"); b.className="body";
      const p = document.createElement("div"); p.textContent = it.property;
      const bd = document.createElement("div"); bd.className="bd"; bd.textContent = itemLine(it);
      b.append(p, bd);
      const a = document.createElement("div"); a.className="amt";
      const n = document.createElement("div"); n.className="num"; n.textContent = yen(sumOf(it));
      a.append(n); li.append(d, b, a); ul.append(li);
    }
    blk.append(head, ul);
    if (v.note){ const nt = document.createElement("p"); nt.className="bd"; nt.style.margin="4px 0 0"; nt.textContent = "備考：" + v.note; blk.append(nt); }
    const actions = document.createElement("div"); actions.className = "row"; actions.style.marginTop = "8px";
    const pv = document.createElement("div"); pv.className = "inv-preview"; pv.hidden = true;
    const m = document.createElement("span"); m.className="msg";
    const pb = document.createElement("button"); pb.className="small"; pb.type="button"; pb.textContent = "PDF";
    const ib = document.createElement("button"); ib.className="small"; ib.type="button"; ib.textContent = "画像";
    const del = document.createElement("button"); del.className="link"; del.type="button"; del.textContent = "削除";
    pb.onclick = () => exportInvoice("pdf", v, m, pv);
    ib.onclick = () => exportInvoice("png", v, m, pv);
    del.onclick = async () => {
      if (!del.dataset.armed){ del.dataset.armed="1"; del.textContent="本当に削除"; del.style.color="var(--bad)"; setTimeout(()=>{ delete del.dataset.armed; del.textContent="削除"; del.style.color=""; },3000); return; }
      del.disabled = true;
      try { await api("deleteInvoice", { id: v.id }); await loadAdmin(); } catch (er) { flash(m, er.message, "err"); del.disabled = false; }
    };
    actions.append(pb, ib, del, m);
    blk.append(actions, pv);
    box.append(blk);
  }
  if (!list.length){ const p = document.createElement("p"); p.className="empty"; p.textContent = `${jpMonth(month)}分の請求はまだ届いていません。`; box.append(p); }
  $("adTotal").textContent = yen(total); $("adUnpaid").textContent = yen(unpaid); $("adCount").textContent = days;
}
async function setPaid(ids, paid, btn){
  btn.disabled = true;
  try { await api("setPaid", { ids, paid }); await loadAdmin(); }
  catch (err) { flash($("csvMsg"), err.message, "err"); btn.disabled = false; }
}
function csvFor(month){
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const rows = [["受付番号","スタッフ","請求日","勤務日","物件","清掃費","駐車場代","その他","その他内容","小計","支払","振込先"].map(q).join(",")];
  for (const v of invoices.filter(x => x.month === month)){
    for (const it of v.lines){
      rows.push([v.id, v.name, v.date, it.date, it.property, int(it.cleaning), int(it.parking), int(it.otherAmt), it.otherNote, sumOf(it), v.paid?"支払済":"未払い", bankLine(v.bank)].map(q).join(","));
    }
  }
  return rows.join("\n");
}
async function loadAdmin(){
  const j = await api("adminList");
  invoices = j.invoices || []; payee = j.payee || "";
  if (document.activeElement !== $("cfgPayee")) $("cfgPayee").value = payee;
  renderAdmin();
}
function startAdmin(){
  $("admin").hidden = false;
  $("lead").textContent = "スタッフから届いた請求の確認・支払管理の画面です。";
  $("adMonth").value = thisMonth();
  $("adMonth").addEventListener("change", renderAdmin);
  $("adReload").onclick = () => loadAdmin().catch(err => flash($("csvMsg"), err.message, "err"));
  $("copyCsv").onclick = () => copyText(csvFor($("adMonth").value || thisMonth()), $("csvMsg"));
  $("cfgForm").addEventListener("submit", async e => {
    e.preventDefault();
    try { await api("setPayee", { payee: $("cfgPayee").value.trim() }); await loadAdmin(); flash($("cfgMsg"), "保存しました", "ok"); }
    catch (err) { flash($("cfgMsg"), err.message, "err"); }
  });
  renderAdmin();
  return loadAdmin();
}

/* ---------- 起動 ---------- */
(async () => {
  const fail = (title, text) => { $("loading").hidden = true; $("staff").hidden = true; $("admin").hidden = true; $("nodbTitle").textContent = title; $("nodbText").textContent = text; $("nodb").hidden = false; };
  if (qs.has("t")) history.replaceState(null, "", location.pathname);  // 古い個人用URLは普通の入力画面にする
  if (!ADMIN) return startStaff();
  $("loading").hidden = false;
  try { await startAdmin(); $("loading").hidden = true; }
  catch (err) { fail("開けませんでした", err.message); }
})();
</script>
